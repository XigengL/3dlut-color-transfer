[package]
name = "lut3d"
version = "0.1.0"
edition = "2021"
description = "Generate a 3D LUT colour transfer from paired before/after photographs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/XigengL/3dlut-color-transfer"
readme = "README.md"
keywords = ["color", "lut", "photography", "grading"]

[dependencies]
eframe = "0.29"
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
kamadak-exif = "0.6"
rayon = "1.10"
rfd = "0.15"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ab_glyph = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "none"
