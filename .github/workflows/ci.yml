name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # egui/eframe needs a few system libraries to build on Linux.
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxkbcommon-dev libssl-dev libgl1-mesa-dev
        working-directory: .

      # The CJK font check skips itself when no suitable font exists. Install one so it
      # actually runs, rather than passing for the wrong reason.
      - name: Install CJK fonts
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fonts-noto-cjk
        working-directory: .

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --release
